name: Test
on: [pull_request]
jobs:
  TestServer:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
      - name: Install & Test
        run: npm install && npm run test -w @nickhudkins/wordle-server
